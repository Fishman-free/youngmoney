[tox]
envlist = unittest, pytest
skipsdist = true

[testenv:unittest]
description = canonical test entry for bnbot (pure stdlib, no deps)
commands = python -m unittest discover -s tests -v

[testenv:pytest]
description = same suite under pytest (tests/conftest.py puts tests/ on sys.path)
commands = python -m pytest -q

[testenv:lint]
description = compile-check every module without executing it
commands = python -m compileall -q bnbot tests
